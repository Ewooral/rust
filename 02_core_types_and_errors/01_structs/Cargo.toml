[package]
name = "structs"
version.workspace = true
edition.workspace = true
default-run = "structs"

[dependencies]

# Exercises and solutions are opt-in so unsolved exercises never break
# `cargo test --workspace`. See README.md for how to run them.
[features]
exercises = []
solutions = []

[[bin]]
name = "ex01_fix_mutability"
path = "exercises/ex01_fix_mutability.rs"
required-features = ["exercises"]

[[bin]]
name = "ex02_fix_update_move"
path = "exercises/ex02_fix_update_move.rs"
required-features = ["exercises"]

[[bin]]
name = "ex03_fix_missing_debug"
path = "exercises/ex03_fix_missing_debug.rs"
required-features = ["exercises"]

[[bin]]
name = "ex04_rectangle_methods"
path = "exercises/ex04_rectangle_methods.rs"
required-features = ["exercises"]

[[bin]]
name = "ex05_temperature_newtype"
path = "exercises/ex05_temperature_newtype.rs"
required-features = ["exercises"]

[[bin]]
name = "ex06_counter"
path = "exercises/ex06_counter.rs"
required-features = ["exercises"]

[[bin]]
name = "sol01_fix_mutability"
path = "solutions/sol01_fix_mutability.rs"
required-features = ["solutions"]

[[bin]]
name = "sol02_fix_update_move"
path = "solutions/sol02_fix_update_move.rs"
required-features = ["solutions"]

[[bin]]
name = "sol03_fix_missing_debug"
path = "solutions/sol03_fix_missing_debug.rs"
required-features = ["solutions"]

[[bin]]
name = "sol04_rectangle_methods"
path = "solutions/sol04_rectangle_methods.rs"
required-features = ["solutions"]

[[bin]]
name = "sol05_temperature_newtype"
path = "solutions/sol05_temperature_newtype.rs"
required-features = ["solutions"]

[[bin]]
name = "sol06_counter"
path = "solutions/sol06_counter.rs"
required-features = ["solutions"]
