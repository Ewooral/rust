[package]
name = "collections"
version.workspace = true
edition.workspace = true
default-run = "collections"

[dependencies]

# Exercises and solutions are opt-in so unsolved exercises never break
# `cargo test --workspace`. See README.md for how to run them.
[features]
exercises = []
solutions = []

[[bin]]
name = "ex01_fix_push_while_iterating"
path = "exercises/ex01_fix_push_while_iterating.rs"
required-features = ["exercises"]

[[bin]]
name = "ex02_fix_string_index"
path = "exercises/ex02_fix_string_index.rs"
required-features = ["exercises"]

[[bin]]
name = "ex03_fix_moved_into_map"
path = "exercises/ex03_fix_moved_into_map.rs"
required-features = ["exercises"]

[[bin]]
name = "ex04_median_and_mode"
path = "exercises/ex04_median_and_mode.rs"
required-features = ["exercises"]

[[bin]]
name = "ex05_pig_latin"
path = "exercises/ex05_pig_latin.rs"
required-features = ["exercises"]

[[bin]]
name = "ex06_word_frequency"
path = "exercises/ex06_word_frequency.rs"
required-features = ["exercises"]

[[bin]]
name = "sol01_fix_push_while_iterating"
path = "solutions/sol01_fix_push_while_iterating.rs"
required-features = ["solutions"]

[[bin]]
name = "sol02_fix_string_index"
path = "solutions/sol02_fix_string_index.rs"
required-features = ["solutions"]

[[bin]]
name = "sol03_fix_moved_into_map"
path = "solutions/sol03_fix_moved_into_map.rs"
required-features = ["solutions"]

[[bin]]
name = "sol04_median_and_mode"
path = "solutions/sol04_median_and_mode.rs"
required-features = ["solutions"]

[[bin]]
name = "sol05_pig_latin"
path = "solutions/sol05_pig_latin.rs"
required-features = ["solutions"]

[[bin]]
name = "sol06_word_frequency"
path = "solutions/sol06_word_frequency.rs"
required-features = ["solutions"]
