[package]
name = "error_handling"
version.workspace = true
edition.workspace = true
default-run = "error_handling"

[dependencies]

# Only the `thiserror_and_anyhow` example uses these, so they are
# dev-dependencies: not compiled into the lesson's main program.
[dev-dependencies]
anyhow = "1"
thiserror = "2"

# Exercises and solutions are opt-in so unsolved exercises never break
# `cargo test --workspace`. See README.md for how to run them.
[features]
exercises = []
solutions = []

[[bin]]
name = "ex01_fix_question_mark_in_main"
path = "exercises/ex01_fix_question_mark_in_main.rs"
required-features = ["exercises"]

[[bin]]
name = "ex02_fix_mismatched_errors"
path = "exercises/ex02_fix_mismatched_errors.rs"
required-features = ["exercises"]

[[bin]]
name = "ex03_fix_ignored_result"
path = "exercises/ex03_fix_ignored_result.rs"
required-features = ["exercises"]

[[bin]]
name = "ex04_parse_temperature"
path = "exercises/ex04_parse_temperature.rs"
required-features = ["exercises"]

[[bin]]
name = "ex05_validated_username"
path = "exercises/ex05_validated_username.rs"
required-features = ["exercises"]

[[bin]]
name = "ex06_question_mark_with_from"
path = "exercises/ex06_question_mark_with_from.rs"
required-features = ["exercises"]

[[bin]]
name = "sol01_fix_question_mark_in_main"
path = "solutions/sol01_fix_question_mark_in_main.rs"
required-features = ["solutions"]

[[bin]]
name = "sol02_fix_mismatched_errors"
path = "solutions/sol02_fix_mismatched_errors.rs"
required-features = ["solutions"]

[[bin]]
name = "sol03_fix_ignored_result"
path = "solutions/sol03_fix_ignored_result.rs"
required-features = ["solutions"]

[[bin]]
name = "sol04_parse_temperature"
path = "solutions/sol04_parse_temperature.rs"
required-features = ["solutions"]

[[bin]]
name = "sol05_validated_username"
path = "solutions/sol05_validated_username.rs"
required-features = ["solutions"]

[[bin]]
name = "sol06_question_mark_with_from"
path = "solutions/sol06_question_mark_with_from.rs"
required-features = ["solutions"]
