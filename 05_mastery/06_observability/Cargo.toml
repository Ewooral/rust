[package]
name = "observability"
version.workspace = true
edition.workspace = true
default-run = "observability"

# - tracing: the facade every crate logs through (spans, events, fields).
# - tracing-subscriber: what to DO with them. `env-filter` reads RUST_LOG,
#   `json` adds JSON output; its default `tracing-log` feature forwards
#   records from the older `log` crate.
# - log: only to show that compatibility (the `log_compat` example).
# - tokio: async spans, and the mini project's concurrent jobs.
[dependencies]
log = "0.4"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# serde_json: tests parse the JSON log lines to check their fields.
[dev-dependencies]
serde_json = "1"

# Exercises and solutions are opt-in so unsolved exercises never break
# `cargo test --workspace`. See README.md for how to run them.
[features]
exercises = []
solutions = []

[[bin]]
name = "ex01_fix_field_value"
path = "exercises/ex01_fix_field_value.rs"
required-features = ["exercises"]

[[bin]]
name = "ex02_fix_instrument_secret"
path = "exercises/ex02_fix_instrument_secret.rs"
