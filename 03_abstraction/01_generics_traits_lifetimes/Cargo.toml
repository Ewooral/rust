[package]
name = "generics_traits_lifetimes"
version.workspace = true
edition.workspace = true
default-run = "generics_traits_lifetimes"

[dependencies]

# Exercises and solutions are opt-in so unsolved exercises never break
# `cargo test --workspace`. See README.md for how to run them.
[features]
exercises = []
solutions = []

[[bin]]
name = "ex01_fix_missing_bound"
path = "exercises/ex01_fix_missing_bound.rs"
required-features = ["exercises"]

[[bin]]
name = "ex02_fix_missing_lifetime"
path = "exercises/ex02_fix_missing_lifetime.rs"
