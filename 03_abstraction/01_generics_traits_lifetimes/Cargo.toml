required-features = ["exercises"]

[[bin]]
name = "ex04_generic_stack"
path = "exercises/ex04_generic_stack.rs"
required-features = ["exercises"]

[[bin]]
name = "ex05_trait_with_defaults"
path = "exercises/ex05_trait_with_defaults.rs"
required-features = ["exercises"]

[[bin]]
name = "ex06_conversion_traits"
path = "exercises/ex06_conversion_traits.rs"
required-features = ["exercises"]

[[bin]]
name = "sol01_fix_missing_bound"
path = "solutions/sol01_fix_missing_bound.rs"
required-features = ["solutions"]

[[bin]]
name = "sol02_fix_missing_lifetime"
