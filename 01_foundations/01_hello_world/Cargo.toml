[package]
name = "hello_world"
version.workspace = true
edition.workspace = true
default-run = "hello_world"

[dependencies]

# Exercises and solutions are opt-in so unsolved exercises never break
# `cargo test --workspace`. See README.md for how to run them.
[features]
exercises = []
solutions = []

[[bin]]
name = "ex01_fix_missing_bang"
path = "exercises/ex01_fix_missing_bang.rs"
required-features = ["exercises"]

[[bin]]
name = "ex02_fix_main_name"
path = "exercises/ex02_fix_main_name.rs"
required-features = ["exercises"]

[[bin]]
name = "ex03_fix_macro_name"
path = "exercises/ex03_fix_macro_name.rs"
required-features = ["exercises"]

[[bin]]
name = "ex04_greeting"
path = "exercises/ex04_greeting.rs"
required-features = ["exercises"]

[[bin]]
name = "sol01_fix_missing_bang"
path = "solutions/sol01_fix_missing_bang.rs"
required-features = ["solutions"]

[[bin]]
name = "sol02_fix_main_name"
path = "solutions/sol02_fix_main_name.rs"
required-features = ["solutions"]

[[bin]]
name = "sol03_fix_macro_name"
path = "solutions/sol03_fix_macro_name.rs"
required-features = ["solutions"]

[[bin]]
name = "sol04_greeting"
path = "solutions/sol04_greeting.rs"
required-features = ["solutions"]
