[package]
name = "functions_and_comments"
version.workspace = true
edition.workspace = true
default-run = "functions_and_comments"

[dependencies]

# Exercises and solutions are opt-in so unsolved exercises never break
# `cargo test --workspace`. See README.md for how to run them.
[features]
exercises = []
solutions = []

[[bin]]
name = "ex01_fix_semicolon_return"
path = "exercises/ex01_fix_semicolon_return.rs"
required-features = ["exercises"]

[[bin]]
name = "ex02_fix_missing_argument"
path = "exercises/ex02_fix_missing_argument.rs"
required-features = ["exercises"]

[[bin]]
name = "ex03_fix_out_of_scope"
path = "exercises/ex03_fix_out_of_scope.rs"
required-features = ["exercises"]

[[bin]]
name = "ex04_pizza_party"
path = "exercises/ex04_pizza_party.rs"
required-features = ["exercises"]

[[bin]]
name = "ex05_split_time"
path = "exercises/ex05_split_time.rs"
required-features = ["exercises"]

[[bin]]
name = "ex06_document_it"
path = "exercises/ex06_document_it.rs"
required-features = ["exercises"]

[[bin]]
name = "sol01_fix_semicolon_return"
path = "solutions/sol01_fix_semicolon_return.rs"
required-features = ["solutions"]

[[bin]]
name = "sol02_fix_missing_argument"
path = "solutions/sol02_fix_missing_argument.rs"
required-features = ["solutions"]

[[bin]]
name = "sol03_fix_out_of_scope"
path = "solutions/sol03_fix_out_of_scope.rs"
required-features = ["solutions"]

[[bin]]
name = "sol04_pizza_party"
path = "solutions/sol04_pizza_party.rs"
required-features = ["solutions"]

[[bin]]
name = "sol05_split_time"
path = "solutions/sol05_split_time.rs"
required-features = ["solutions"]

[[bin]]
name = "sol06_document_it"
path = "solutions/sol06_document_it.rs"
required-features = ["solutions"]
