[package]
name = "axum_basics"
version.workspace = true
edition.workspace = true
default-run = "axum_basics"

# - `axum`'s `macros` feature adds `#[debug_handler]` (readable errors for
#   handlers that don't compile) and the `FromRequest` derives.
# - `tower` with `util` gives `ServiceExt::oneshot`: call a Router like a
#   function, with no network. The exercises' tests need it, so it is a
#   normal dependency rather than a dev-dependency.
# - `tower-http` provides the ready-made middleware (tracing, timeouts, CORS).
# - `tracing-subscriber` prints the logs that `tracing` and `TraceLayer` emit;
#   `env-filter` lets `RUST_LOG` choose how much.
[dependencies]
axum = { version = "0.8.9", features = ["macros"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.6.11", features = ["cors", "timeout", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Exercises and solutions are opt-in so unsolved exercises never break
# `cargo test --workspace`. See README.md for how to run them.
[features]
exercises = []
solutions = []

[[bin]]
name = "ex01_fix_extractor_order"
path = "exercises/ex01_fix_extractor_order.rs"
required-features = ["exercises"]

[[bin]]
name = "ex02_fix_guard_across_await"
path = "exercises/ex02_fix_guard_across_await.rs"
required-features = ["exercises"]

[[bin]]
name = "ex03_fix_state_not_clone"
path = "exercises/ex03_fix_state_not_clone.rs"
required-features = ["exercises"]

[[bin]]
name = "ex04_todo_handlers"
path = "exercises/ex04_todo_handlers.rs"
required-features = ["exercises"]

[[bin]]
name = "ex05_api_error"
path = "exercises/ex05_api_error.rs"
required-features = ["exercises"]

[[bin]]
name = "ex06_api_key_middleware"
path = "exercises/ex06_api_key_middleware.rs"
required-features = ["exercises"]

[[bin]]
name = "sol01_fix_extractor_order"
path = "solutions/sol01_fix_extractor_order.rs"
required-features = ["solutions"]

[[bin]]
name = "sol02_fix_guard_across_await"
path = "solutions/sol02_fix_guard_across_await.rs"
required-features = ["solutions"]

[[bin]]
name = "sol03_fix_state_not_clone"
path = "solutions/sol03_fix_state_not_clone.rs"
required-features = ["solutions"]

[[bin]]
name = "sol04_todo_handlers"
