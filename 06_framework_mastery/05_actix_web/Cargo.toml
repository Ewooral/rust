[[bin]]
name = "ex05_json_errors"
path = "exercises/ex05_json_errors.rs"
required-features = ["exercises"]

[[bin]]
name = "ex06_api_key_middleware"
path = "exercises/ex06_api_key_middleware.rs"
required-features = ["exercises"]

[[bin]]
