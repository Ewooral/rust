[package]
name = "actix_web_basics"
version.workspace = true
edition.workspace = true
default-run = "actix_web_basics"

# - `actix-web` with `default-features = false` and only `macros` (for
#   `#[get]`, `#[post]`, `#[actix_web::main]`, `#[actix_web::test]`). The
#   default features add response compression (brotli, gzip and zstd), cookies,
#   HTTP/2, WebSockets and Unicode-aware routing. `compress-zstd` compiles the
#   zstd C library (`zstd-sys` builds it with the `cc` crate), so turning the
#   defaults off also means no C compiler is needed, and a much faster build.
# - `serde`/`serde_json`: JSON bodies.
# - `tokio`: the raw-TCP client in `src/client.rs` (Actix runs on Tokio).
# - `tracing` for the handlers' own log events; `tracing-subscriber` prints
#   them, and Actix's `log` lines too (the `Logger` middleware).
[dependencies]
actix-web = { version = "4.19.0", default-features = false, features = ["macros"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Exercises and solutions are opt-in so unsolved exercises never break
# `cargo test --workspace`. See README.md for how to run them.
[features]
exercises = []
solutions = []

[[bin]]
name = "ex01_fix_not_a_responder"
path = "exercises/ex01_fix_not_a_responder.rs"
required-features = ["exercises"]

[[bin]]
name = "ex02_fix_error_not_response_error"
