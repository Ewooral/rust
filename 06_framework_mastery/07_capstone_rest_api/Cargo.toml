required-features = ["exercises"]

[[bin]]
name = "ex03_fix_incompatible_branches"
path = "exercises/ex03_fix_incompatible_branches.rs"
required-features = ["exercises"]

[[bin]]
name = "ex04_pagination"
path = "exercises/ex04_pagination.rs"
