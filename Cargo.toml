[workspace]
resolver = "3"
members = [
    "01_foundations/01_hello_world",
    "01_foundations/02_guessing_game",
    "01_foundations/03_variables_and_data_types",
    "01_foundations/04_functions_and_comments",
    "01_foundations/05_control_flow",
    "01_foundations/06_ownership",
    "02_core_types_and_errors/01_structs",
    "02_core_types_and_errors/02_enums_and_pattern_matching",
    "02_core_types_and_errors/03_packages_crates_modules",
    "02_core_types_and_errors/04_collections",
    "02_core_types_and_errors/05_error_handling",
    "03_abstraction/01_generics_traits_lifetimes",
    "03_abstraction/02_automated_tests",
    "03_abstraction/03_minigrep_cli_project",
    "03_abstraction/04_iterators_and_closures",
    "03_abstraction/05_cargo_and_crates_io",
    "03_abstraction/06_smart_pointers",
    "03_abstraction/07_trait_objects_and_oop",
    "03_abstraction/08_patterns_and_matching",
    "04_systems_level/01_fearless_concurrency",
    "04_systems_level/02_async_await",
    "04_systems_level/03_advanced_features",
    "04_systems_level/04_web_server_project",
    "05_mastery/01_async_traits_from_scratch",
    "05_mastery/02_macros_in_depth",
    "05_mastery/03_performance",
    "05_mastery/04_api_design",
    "05_mastery/05_advanced_testing",
    "05_mastery/06_observability",
    "05_mastery/07_serialization",
    "05_mastery/08_no_std_and_embedded",
    "05_mastery/09_webassembly",
    "05_mastery/10_capstone_cli_tool",
    "05_mastery/11_capstone_interpreter",
    "06_framework_mastery/01_axum",
    "06_framework_mastery/02_tokio",
    "06_framework_mastery/03_sqlx",
    "06_framework_mastery/04_clap",
    "06_framework_mastery/05_actix_web",
    "06_framework_mastery/06_tauri_and_bevy",
    "06_framework_mastery/07_capstone_rest_api",
    "xtask",
]

[workspace.package]
edition = "2024"
version = "0.1.0"

# Keep the build folder small. Every exercise, solution and example is its
# own executable, and on Windows each one used to get a full .pdb file of
# debug symbols (7.8 GB of a 12 GB target/). Line tables keep file:line
# numbers in panics and backtraces; third-party crates get no debug info.
# To step through code in a debugger, temporarily set `debug = true` here.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
